# .github/workflows/deploy.yml
# ═══════════════════════════════════════════════════════════════════
# GitHub Actions: Автоматический деплой на GitHub Pages
# 
# Триггер: push в ветку main
# Результат: сайт публикуется на https://mtechcore.github.io/
# ═══════════════════════════════════════════════════════════════════

name: Deploy to GitHub Pages

on:
  # Запускаем при пуше в main
  push:
    branches: [main]
  # Позволяем запустить вручную из вкладки Actions
  workflow_dispatch:

# Разрешения для GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Разрешаем только один деплой одновременно
concurrency:
  group: "pages"
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────
# ЗАДАЧИ
# ─────────────────────────────────────────────────────────────────
jobs:
  # ═══════════════════════════════════════════════════════════════
  # JOB 1: Сборка сайта
  # ═══════════════════════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      # Шаг 1: Клонируем репозиторий
      - name: Checkout
        uses: actions/checkout@v4

      # Шаг 2: Настраиваем Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Шаг 3: Устанавливаем зависимости
      - name: Install dependencies
        run: npm ci

      # Шаг 4: Собираем Astro
      - name: Build with Astro
        run: npm run build

      # Шаг 5: Загружаем артефакт для деплоя
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ═══════════════════════════════════════════════════════════════
  # JOB 2: Деплой на GitHub Pages
  # ═══════════════════════════════════════════════════════════════
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    
    # Указываем окружение GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      # Деплоим собранный сайт
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
